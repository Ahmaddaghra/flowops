name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Format & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/FlowOps.sln

      - name: Verify code formatting
        run: dotnet format backend/FlowOps.sln --verify-no-changes --no-restore

      - name: Build solution
        run: dotnet build backend/FlowOps.sln --no-restore

      - name: Run unit tests
        run: dotnet test backend/FlowOps.sln --no-build
